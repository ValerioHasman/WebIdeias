<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content, user-scalable=no" />
  <title>Documento</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="main.js"></script>
</head>

<body>
  <div class="anchor p-2 bg-body-tertiary rounded-2 border fs-3 text-break-spaces mh-100 overflow-auto" contenteditable> ⚓︎ </div>

  <div contenteditable class="infobox bg-body-secondary border shadow-sm p-2 rounded-2 bg-opacity-25 text-break-spaces mh-100 overflow-auto">Uma frase para testar os posicionamentos dinâmicos.</div>

  <form id="position-area-form" class="d-flex gap-2 flex-column shadow-sm border mt-2 me-2 p-2 rounded-2 bg-body-tertiary">
    <div>
      <select class="form-select form-select-sm text-uppercase font-monospace" id="position-area-select" name="position-area-select"></select>
    </div>
    <output class="pre-output font-monospace user-select-all mt-2 mb-0 ms-2 fs-6"></output>
    <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="location.reload()"><i class="bi bi-arrow-clockwise me-2"></i>Restaurar</button>
  </form>
</body>

</html>
